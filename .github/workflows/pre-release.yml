name: Pre-Release Model-Service Container

on:
  push:
    branches-ignore:
      - modelservicetag
    tags-ignore:
      - "v*"
    paths-ignore:
      - ".github/workflows/**"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: doda25-team5/sms-backend

jobs:
  prerelease:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read base version from VERSION file
        run: |
          VER=$(cat version)
          BASE=${VER%-SNAPSHOT}
          echo "BASE=$BASE" >> $GITHUB_ENV

      - name: Compute branch name
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          SAFE_BRANCH=$(echo "$BRANCH" | tr '/._' '---' | tr -cd '[:alnum:]-')
          echo "BRANCH=$SAFE_BRANCH" >> $GITHUB_ENV

      - name: Compute timestamp
        run: echo "TS=$(date +'%y%m%d-%H%M%S')" >> $GITHUB_ENV

      - name: Set pre-release version
        run: |
          NEW_VERSION="${BASE}-${BRANCH}-${TS}"
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV
          echo "Pre-release version: $NEW_VERSION"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up QEMU (for multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push pre-release image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.NEW_VERSION }}
            