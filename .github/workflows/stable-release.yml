name: Stable Release (Model-Service Container)

on:
  push:
    branches:
      - modelservicetag

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: doda25-team5/sms-backend

jobs:
  release:
    # Loop prevention
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Configure Git user
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"


      - name: Prepare Release Version
        run: |
          CURRENT=$(cat version)
          echo "Current version: $CURRENT"

          # Guard: only release SNAPSHOT versions
          if [[ "$CURRENT" != *"-SNAPSHOT" ]]; then
            echo "Not a SNAPSHOT version. Skipping release."
            exit 0
          fi

          # Strip -SNAPSHOT
          RELEASE_VERSION=${CURRENT%-SNAPSHOT}
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> $GITHUB_ENV

          # Update VERSION file
          echo "$RELEASE_VERSION" > version

          # Commit and tag
          git add version
          git commit -m "Release v$RELEASE_VERSION [skip ci]"
          git tag "v$RELEASE_VERSION"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up QEMU (for multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push stable image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.RELEASE_VERSION }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Bump to next SNAPSHOT version
        run: |
          IFS='.' read MAJOR MINOR PATCH <<< "${RELEASE_VERSION}"
          NEXT_PATCH=$((PATCH + 1))
          NEXT_SNAPSHOT="${MAJOR}.${MINOR}.${NEXT_PATCH}-SNAPSHOT"
          echo "NEXT_SNAPSHOT=$NEXT_SNAPSHOT" >> $GITHUB_ENV

          echo "$NEXT_SNAPSHOT" > version

      - name: Commit and push new SNAPSHOT
        run: |
          git add VERSION
          git commit -m "Bump version to ${NEXT_SNAPSHOT} [skip ci]"
          git push origin main --follow-tags
